<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Penilaian Kinerja Guru</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b1166">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PKG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html,body{height:100%;margin:0;background:#2b1166;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
body{box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
iframe{display:block;width:100%;height:100%;border:0;background:#f6f4fb}
#ms{position:fixed;inset:0;display:grid;place-content:center;gap:14px;text-align:center;padding:24px;background:#2b1166;color:#fff}
#ms[hidden]{display:none}
#ms button,#ms a{background:#f5b301;color:#2b1166;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
</style></head>
<body>
<iframe id="f" title="Penilaian Kinerja Guru" allow="clipboard-write"></iframe>
<div id="ms" hidden></div>
<script>
// ISI dengan alamat aplikasi web Apps Script Anda (Deploy > Aplikasi web, berakhiran /exec)
const URL_APP = 'https://script.google.com/macros/s/AKfycbwVmu7KcaesPrOLI7JfNE7gb-jpJaI9bJ3wV760i9YURdgNHEu2kwi8oLUwLBXvAv-jOA/exec';

const ms = document.getElementById('ms'), f = document.getElementById('f');
function pesan(h) { ms.innerHTML = h; ms.hidden = false; }
if (URL_APP.includes('ISI_ID_DEPLOYMENT')) pesan('<b>Alamat aplikasi belum diisi</b><span>Buka index.html dan isi URL_APP.</span>');
else if (!navigator.onLine) pesan('<b>Tidak ada koneksi internet</b><span>Sambungkan internet lalu coba lagi.</span><button onclick="location.reload()">Coba lagi</button>');
else f.src = URL_APP;
addEventListener('offline', () => pesan('<b>Koneksi terputus</b><button onclick="location.reload()">Muat ulang</button>'));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script></body></html>
